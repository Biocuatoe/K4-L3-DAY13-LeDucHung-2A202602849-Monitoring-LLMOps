alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602849
    runbook: docs/alerts.md#highlatencyp95

  - name: ElevatedErrorRate
    severity: critical
    condition: 'error_rate_pct > 2'
    duration: 10m
    type: symptom-based
    channel: slack
    owner: student-2A202602849
    runbook: docs/alerts.md#elevatederrorrate

  - name: DegradedRetrievalSuccess
    severity: warning
    condition: 'retrieval_success_rate_pct < 90'
    duration: 15m
    type: symptom-based
    channel: slack
    owner: student-2A202602849
    runbook: docs/alerts.md#degradedretrievalsuccess
